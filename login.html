<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container" style="max-width: 400px; margin-top: 12vh;">
        <h4 class="text-center mb-3">Sistema de impuestos a las actividades economicas</h4>
        <h5 class="text-center mb-3">Login</h5>
        <form id="frmLogin">
            <div class="mb-2">
                <input required placeholder="Usuario" name="txtUsuarioLogin" id="txtUsuarioLogin"
                    class="form-control" type="text" autocomplete="username" autofocus>
            </div>
            <div class="mb-2">
                <input required placeholder="Clave" name="txtClaveLogin" id="txtClaveLogin"
                    class="form-control" type="password" autocomplete="current-password">
            </div>
            <div class="d-grid">
                <input type="submit" value="Ingresar" class="btn btn-primary">
            </div>
            <div class="alert alert-danger mt-3 d-none" id="lblErrorLogin"></div>
        </form>
    </div>

    <script>
        frmLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            lblErrorLogin.classList.add('d-none');
            let response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuario: txtUsuarioLogin.value,
                    clave: txtClaveLogin.value
                })
            });
            let respuesta = await response.json();
            if (respuesta.msg != 'ok') {
                lblErrorLogin.textContent = respuesta.msg;
                lblErrorLogin.classList.remove('d-none');
                txtClaveLogin.value = '';
                return;
            }
            location.href = '/index.html';
        });
    </script>
</body>

</html>
