<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row mt-2">
            <div class="col-12 text-end">
                <a href="/index.html" class="btn btn-outline-secondary btn-sm">Sistema de impuestos</a>
                <a href="/logout" class="btn btn-outline-danger btn-sm">Cerrar sesión</a>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <h4 class="text-center">Usuarios</h4>
            </div>
            <div class="col-6">
                <form id="frmUsuario">
                    <div class="container text-center">
                        <div class="row mb-2">
                            <div class="col">
                                <input required maxlength="35" placeholder="Usuario" name="txtUsuario"
                                    id="txtUsuario" class="form-control" type="text" autocomplete="off">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <input maxlength="35" placeholder="Clave" name="txtClave" id="txtClave"
                                    class="form-control" type="password" autocomplete="new-password">
                                <small class="text-muted" id="lblAyudaClave"></small>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <input pattern="^[A-Za-záéíóúÁÉÍÓÚñÑ ]{3,}$" required maxlength="85"
                                    placeholder="Nombre" name="txtNombre" id="txtNombre" class="form-control"
                                    type="text">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <input required maxlength="100" placeholder="Direccion" name="txtDireccion"
                                    id="txtDireccion" class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <input pattern="^[0-9]{4}-[0-9]{4}$" required maxlength="9"
                                    placeholder="Telefono (0000-0000)" name="txtTelefono" id="txtTelefono"
                                    class="form-control" type="text">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <div class="col">
                                <input type="submit" value="Guardar" class="btn btn-primary">
                                <input type="reset" value="Limpiar" class="btn btn-warning">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col-6">
                <form id="frmConsultarUsuario">
                    <div class="container text-center">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th colspan="5">
                                            <input type="search" placeholder="buscar por usuario o nombre"
                                                id="txtBuscarUsuario" name="txtBuscarUsuario" class="form-control">
                                        </th>
                                    </tr>
                                    <tr>
                                        <th>usuario</th>
                                        <th>nombre</th>
                                        <th>direccion</th>
                                        <th>telefono</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody id="tbodyUsuarios"></tbody>
                            </table>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        var accion = 'nuevo', idUsuario = '';

        const esc = t => String(t ?? '').replace(/[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        frmUsuario.addEventListener('submit', (e) => {
            e.preventDefault();
            guardarUsuario();
        });
        frmUsuario.addEventListener('reset', (e) => {
            e.preventDefault();
            limpiarFormulario();
        });
        frmConsultarUsuario.addEventListener('submit', (e) => e.preventDefault());
        txtBuscarUsuario.addEventListener('keyup', obtenerUsuarios);
        document.addEventListener('DOMContentLoaded', obtenerUsuarios);

        async function obtenerUsuarios() {
            let response = await fetch('/usuarios?buscar=' + encodeURIComponent(txtBuscarUsuario.value));
            if (response.status == 401) { location.href = '/login.html'; return; }
            let datos = await response.json();
            mostrarUsuarios(datos);
        }

        function mostrarUsuarios(datos) {
            tbodyUsuarios.innerHTML = '';
            datos.forEach(u => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${esc(u.usuario)}</td>
                    <td>${esc(u.nombre)}</td>
                    <td>${esc(u.direccion)}</td>
                    <td>${esc(u.telefono)}</td>
                    <td></td>`;

                let btnEliminar = document.createElement('input');
                btnEliminar.type = 'button';
                btnEliminar.value = 'Eliminar';
                btnEliminar.className = 'btn btn-danger btn-sm';
                btnEliminar.addEventListener('click', () => eliminarUsuario(u));

                let btnModificar = document.createElement('input');
                btnModificar.type = 'button';
                btnModificar.value = 'Modificar';
                btnModificar.className = 'btn btn-warning btn-sm';
                btnModificar.addEventListener('click', () => modificarUsuario(u));

                tr.lastElementChild.append(btnEliminar, btnModificar);
                tbodyUsuarios.appendChild(tr);
            });
        }

        async function eliminarUsuario(data) {
            if (!confirm(`¿Seguro de eliminar el usuario: ${data.usuario}?`)) return;
            idUsuario = data.idUsuario;
            accion = 'eliminar';
            await guardarUsuario();
        }

        function modificarUsuario(data) {
            idUsuario = data.idUsuario;
            accion = 'modificar';
            txtUsuario.value = data.usuario;
            txtClave.value = '';
            txtClave.required = false;
            lblAyudaClave.textContent = 'Deje la clave vacía para conservar la actual.';
            txtNombre.value = data.nombre;
            txtDireccion.value = data.direccion;
            txtTelefono.value = data.telefono;
        }

        async function guardarUsuario() {
            let datos = {
                usuario: txtUsuario.value,
                clave: txtClave.value,
                nombre: txtNombre.value,
                direccion: txtDireccion.value,
                telefono: txtTelefono.value,
                accion,
                idUsuario
            };
            let response = await fetch('/usuario', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if (response.status == 401) { location.href = '/login.html'; return; }
            let respuesta = await response.json();
            if (respuesta.msg != 'ok') {
                alert('Error: ' + respuesta.msg);
                if (accion == 'eliminar') limpiarFormulario();
                return;
            }
            limpiarFormulario();
            obtenerUsuarios();
        }

        function limpiarFormulario() {
            accion = 'nuevo';
            idUsuario = '';
            txtUsuario.value = '';
            txtClave.value = '';
            txtClave.required = true;
            lblAyudaClave.textContent = '';
            txtNombre.value = '';
            txtDireccion.value = '';
            txtTelefono.value = '';
        }

        txtClave.required = true;
    </script>
</body>

</html>
